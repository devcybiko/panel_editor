[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panel-editor"
version = "0.1.0"
description = "A visual panel editor built with Textual"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Greg", email = "your-email@example.com"}
]
dependencies = [
    "textual>=0.1.0",
    "textual-dev>=1.0.0",
    "textual-web>=0.1.0",
    "pyperclip>=1.8.0",
    "munch>=2.5.0",
    "json5>=0.9.0",
    "pyinstaller>=6.0.0",
    "tree-sitter-python>=0.20.0",
    "tree-sitter-ruby>=0.20.0",
    "glslib @ git+https://github.com/devcybiko/glslib.git",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yourusername/panel-editor"
Repository = "https://github.com/yourusername/panel-editor"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
